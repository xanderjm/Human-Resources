<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minigun component fit QA</title>
<style>body{margin:0;background:#eef0e9;color:#22352e;font:14px system-ui}header{padding:16px}h1{font-size:20px;margin:0 0 6px}button{font:inherit;padding:9px;margin-right:5px}#stage{height:650px}#details{white-space:pre-wrap;padding:16px;font:12px monospace}canvas{display:block;width:100%;height:100%}</style>
<header><h1>Neutral component fit QA</h1><p>Separate head and pedestal, measured trunnion/bearing coordinates. No character, jeep, rig or animation.</p><div id="status">Loading actual models…</div><p><button data-view="three">Three-quarter</button><button data-view="front">Front</button><button data-view="right">Right</button><button data-view="under">Underside</button><button data-view="back">Back</button></p></header><div id="stage"></div><pre id="details"></pre>
<script type="importmap">{"imports":{"three":"/tools/model-viewer/node_modules/three/build/three.module.js","three/addons/":"/tools/model-viewer/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.querySelector('#stage');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;stage.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f4f6ef');scene.add(new THREE.HemisphereLight(0xffffff,0xb6bbad,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-3,5,4);scene.add(sun);const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.01,100);const controls=new OrbitControls(camera,renderer.domElement);const group=new THREE.Group();scene.add(group);
const report=await fetch('/assets/production/records/jeep-minigun-head/component-fit.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());const loader=new GLTFLoader();const [head,mount]=await Promise.all([loader.loadAsync('/'+report.head_model+'?v='+Date.now()),loader.loadAsync('/'+report.mount_model+'?v='+Date.now())]);head.scene.position.fromArray(report.head_translation_m);head.scene.name='Separate head';mount.scene.name='Separate mount';group.add(head.scene,mount.scene);const box=new THREE.Box3().setFromObject(group);const centre=box.getCenter(new THREE.Vector3());const extent=box.getSize(new THREE.Vector3());const distance=Math.max(extent.x,extent.y,extent.z)*1.85;controls.target.copy(centre);
function view(name){const directions={three:[1,.6,1],front:[0,.05,1],right:[1,.05,0],under:[.1,-1,.1],back:[0,.05,-1]};camera.position.copy(centre).addScaledVector(new THREE.Vector3(...directions[name]).normalize(),distance);camera.lookAt(centre);controls.update()}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>view(button.dataset.view);view('three');document.querySelector('#status').textContent='Both current GLBs loaded · neutral static fit only';document.querySelector('#details').textContent=JSON.stringify(report,null,2);function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
</script></html>
