<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model review sheet</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eceee8;color:#20352e;font:14px/1.45 system-ui}header{padding:20px}h1{font-size:22px;margin:0 0 6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:0 16px 24px}.card{border:1px solid #bccbbf;background:#fff;border-radius:8px;overflow:hidden}.card h2{font-size:17px;margin:14px 14px 4px}.meta{margin:0 14px 10px;color:#5a6d60;font-size:12px}.views{display:grid;grid-template-columns:1fr 1fr;gap:2px}.views img{width:100%;display:block}a{color:#17694e}.error{color:#9c3028}.ref{width:70px;float:right;margin:8px}#renderer{position:fixed;left:-2000px;top:0}</style>
<header><h1>Actual model review</h1><p>Left: three-quarter. Right: opposite side. Renders use downloaded geometry and embedded colour textures.</p><div id="status">Loading…</div></header><main id="cards"></main><div id="renderer"></div>

<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,512);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.querySelector('#renderer').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f7f8f4');scene.add(new THREE.HemisphereLight(0xffffff,0xb6bbad,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-3,5,4);scene.add(sun);const camera=new THREE.PerspectiveCamera(35,1,.01,1000);const loader=new GLTFLoader();
const inv=await fetch('/assets/production/inventory.json').then(r=>r.json());const wanted=new URL(location.href).searchParams.get('assets')?.split(',');const assets=inv.assets.filter(a=>a.kind==='tripo_model'&&(!wanted||wanted.includes(a.id)));let finished=0;
for(const a of assets){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=a.title;card.append(title);const meta=document.createElement('p');meta.className='meta';card.append(meta);document.querySelector('#cards').append(card);
try{const response=await fetch('/assets/production/records/'+a.id+'/model-audit.json',{cache:'no-store'});if(!response.ok)throw Error('Model audit not ready');const audit=await response.json();const gltf=await loader.loadAsync('/'+audit.model_file+'?review='+Date.now());const object=gltf.scene;scene.add(object);const box=new THREE.Box3().setFromObject(object),centre=box.getCenter(new THREE.Vector3()),extent=box.getSize(new THREE.Vector3());const distance=Math.max(extent.x,extent.y,extent.z)*1.95;const views=document.createElement('div');views.className='views';card.append(views);
for(const [label,direction] of [['Three-quarter',[1,.65,1]],['Opposite',[-1,.55,-1]]]){camera.position.copy(centre).addScaledVector(new THREE.Vector3(...direction).normalize(),distance);camera.near=distance/100;camera.far=distance*20;camera.updateProjectionMatrix();camera.lookAt(centre);renderer.render(scene,camera);const image=document.createElement('img');image.alt=a.title+' — '+label;image.src=renderer.domElement.toDataURL('image/png');views.append(image)}
meta.textContent=audit.triangles+' triangles · '+audit.visual_review.status+' · '+(audit.import_review.status==='passed'?'metres/pivot checked':'raw coordinates');const link=document.createElement('a');link.href='/tools/model-viewer/index.html?asset='+a.id;link.textContent='Inspect / rotate';link.style='display:inline-block;margin:10px 14px';card.append(link);const reference=document.createElement('img');reference.className='ref';reference.src='/'+a.reference.path;reference.alt='Approved reference';card.append(reference);scene.remove(object);const textures=new Set();object.traverse(n=>{if(n.isMesh){n.geometry.dispose();for(const m of [].concat(n.material)){for(const key of ['map','normalMap','roughnessMap','metalnessMap','aoMap'])if(m[key])textures.add(m[key]);m.dispose()}}});textures.forEach(t=>t.dispose());}
catch(error){meta.className+=' error';meta.textContent=error.message}
finished++;document.querySelector('#status').textContent=finished+' / '+assets.length+' reviewed renders loaded';}
renderer.dispose();
</script></html>
