<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFO asset review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0e9;color:#21372d;font:15px/1.5 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #c8d1c9;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}select,button{font:inherit;padding:8px 12px;border:1px solid #9cafa1;background:#fff;border-radius:6px;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #368b75;outline-offset:3px}main{padding:24px;display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:24px}.stage{background:#fafbf8;border:1px solid #c8d1c9;border-radius:12px;overflow:hidden;min-height:620px;position:relative}canvas{display:block;width:100%;height:620px}.controls{padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #c8d1c9}.ref{display:block;width:100%;background:white;border:1px solid #d4ddd5;border-radius:10px}aside h2{margin:12px 0 6px;font-size:19px}.status{font-size:13px;color:#53725f}pre{white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto}.error{color:#9b302a}a{color:#176e56}@media(max-width:800px){main{grid-template-columns:1fr}.stage{min-height:450px}canvas{height:450px}}
</style>
<header><h1>UFO asset review</h1><select id="asset" aria-label="Asset"></select><span id="status" role="status">Loading inventory…</span><a href="collection.html">All assets ↗</a><a href="modular.html">Modular UFO ↗</a></header>
<main><section class="stage"><div class="controls"><button data-view="three">Three-quarter</button><button data-view="front">Front</button><button data-view="back">Back</button><button data-view="left">Left</button><button data-view="right">Right</button><button data-view="top">Top</button><button data-view="bottom">Underside</button><button id="wire">Wireframe</button><button id="unlit">Albedo only</button></div><div id="render"></div></section><aside><img class="ref" id="reference" alt="Approved white-background asset reference"><h2 id="title"></h2><p class="status" id="review"></p><a id="download">Download model</a><pre id="details"></pre></aside></main>
<script type="importmap">{"imports":{"three":"/tools/model-viewer/node_modules/three/build/three.module.js","three/addons/":"/tools/model-viewer/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
document.querySelector('#render').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f5f6f1');
const camera=new THREE.PerspectiveCamera(35,1,.01,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0xb8beb4,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-3,5,4);scene.add(sun);
const grid=new THREE.GridHelper(4,16,0xc3cbbf,0xe0e5dc);grid.position.y=-.01;scene.add(grid);
const loader=new GLTFLoader();let object=null,box=null,generation=0;const originals=new Map();
function size(){const el=document.querySelector('#render');let w=el.clientWidth,h=matchMedia('(max-width:800px)').matches?450:620;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',size);size();
function setView(v){if(!box)return;const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()),r=Math.max(s.x/camera.aspect,s.y,s.z/camera.aspect)*2.3;const dirs={three:[1,.65,1],front:[0,.12,1],back:[0,.12,-1],left:[-1,.12,0],right:[1,.12,0],top:[0,1,.001],bottom:[0,-1,.001]};let dir=new THREE.Vector3(...dirs[v]).normalize();camera.position.copy(c).addScaledVector(dir,r);camera.near=r/100;camera.far=r*20;camera.updateProjectionMatrix();controls.target.copy(c);controls.update();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.querySelector('#wire').onclick=()=>{if(object)object.traverse(n=>{if(n.isMesh){for(const m of [].concat(n.material))m.wireframe=!m.wireframe}})};
document.querySelector('#unlit').onclick=()=>{if(object)object.traverse(n=>{if(n.isMesh){if(originals.has(n)){n.material.dispose();n.material=originals.get(n);originals.delete(n)}else{originals.set(n,n.material);let m=n.material;n.material=new THREE.MeshBasicMaterial({map:m.map,color:m.color,side:THREE.DoubleSide})}}})};
async function load(a){const token=++generation;if(object){scene.remove(object);object.traverse(n=>{if(n.isMesh){n.geometry.dispose();[].concat(n.material).forEach(m=>m.dispose())}});object=null;box=null;}document.querySelector('#download').removeAttribute('href');document.querySelector('#details').textContent='';document.querySelector('#status').className='';document.querySelector('#title').textContent=a.title;document.querySelector('#reference').src='/'+a.reference.path;document.querySelector('#review').textContent=a.reference.review||a.reference.notes||'Approved isolated reference';document.querySelector('#status').textContent='Loading model…';let record;try{const res=await fetch('/assets/production/records/'+a.id+'/model-audit.json',{cache:'no-store'});if(!res.ok)throw Error('Model audit not ready');record=await res.json();if(token!==generation)return;const gltf=await loader.loadAsync('/'+record.model_file+'?review='+Date.now());if(token!==generation){gltf.scene.traverse(n=>{if(n.isMesh){n.geometry.dispose();[].concat(n.material).forEach(m=>m.dispose())}});return}if(object){scene.remove(object);object.traverse(n=>{if(n.isMesh){n.geometry.dispose();[].concat(n.material).forEach(m=>m.dispose())}})}originals.clear();object=gltf.scene;scene.add(object);box=new THREE.Box3().setFromObject(object);grid.position.y=box.min.y-.005;setView('three');document.querySelector('#details').textContent=JSON.stringify(record,null,2);document.querySelector('#download').href='/'+record.model_file;document.querySelector('#download').download=a.id+'.glb';document.querySelector('#status').textContent=['accepted','passed_authoring_review'].includes(record.visual_review?.status)?'Model accepted after visual review':'Model awaiting visual review';window.assetReview={asset:a.id,loaded:true,model:record.model_file};}catch(e){document.querySelector('#status').textContent=e.message;document.querySelector('#status').className='error';window.assetReview={asset:a.id,loaded:false,error:e.message}}}
const data=await fetch('/assets/production/inventory.json').then(r=>r.json());const ready=data.assets.filter(a=>a.reference.status==='approved'&&['tripo_model','procedural_model'].includes(a.kind));const select=document.querySelector('#asset');for(const a of ready){const o=document.createElement('option');o.value=a.id;o.textContent=a.title;select.append(o)}const wanted=new URL(location.href).searchParams.get('asset');select.value=ready.some(a=>a.id===wanted)?wanted:ready[0]?.id;select.onchange=()=>load(ready.find(a=>a.id===select.value));if(select.value)await load(ready.find(a=>a.id===select.value));
function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();
</script></html>
