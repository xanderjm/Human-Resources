name: Foundation quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13.5'
      - name: Prepare pinned offline art tools
        run: python3 tools/bootstrap_art_tools.py --download-blender
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            external
            build/host-tools
          key: quality-host-tools-${{ hashFiles('dependencies.lock.json') }}
      - name: Install pinned quality toolchain
        run: brew install ninja llvm@22
      - name: Resolve LLVM tool paths
        run: echo "LLVM_ROOT=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
      - name: Select compatible installed Xcode
        run: python3 tools/generators/select_xcode.py --minimum-major 26 --github-env "$GITHUB_ENV"
      - name: Install Xcode Metal toolchain component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Bootstrap and verify exact dependencies
        run: |
          python3 tools/project.py bootstrap
          python3 tools/generators/bootstrap_dependencies.py --root . --verify-only
      - name: Check C++ formatting
        run: CLANG_FORMAT="$LLVM_ROOT/bin/clang-format" scripts/check-cpp-format.sh
      - name: Run clang-tidy
        run: CLANG_TIDY="$LLVM_ROOT/bin/clang-tidy" scripts/check-cpp-analysis.sh
      - name: Run sanitizers
        run: python3 tools/project.py test --preset asan-ubsan
      - name: Run source coverage
        run: >-
          LLVM_PROFDATA="$LLVM_ROOT/bin/llvm-profdata"
          LLVM_COV="$LLVM_ROOT/bin/llvm-cov"
          LLVM_CC="$LLVM_ROOT/bin/clang"
          LLVM_CXX="$LLVM_ROOT/bin/clang++"
          scripts/coverage.sh
      - name: Record exact quality evidence
        run: python3 tools/project.py evidence --output build/evidence/quality.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-quality-evidence
          path: build/evidence
          if-no-files-found: error
