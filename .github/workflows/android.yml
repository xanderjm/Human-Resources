name: Android compile and lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13.5'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - name: Prepare pinned offline art tools
        run: python3 tools/bootstrap_art_tools.py --download-blender
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            external
            build/host-tools
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ runner.temp }}/android-sdk
          key: android-cli-15859902-api-36-${{ hashFiles('dependencies.lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install checksum-pinned Android command-line tools
        run: |
          if [[ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
            unpack="$RUNNER_TEMP/android-command-line-tools"
            curl --fail --location --retry 3 \
              'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
              --output "$archive"
            echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$archive" | sha256sum --check
            mkdir -p "$unpack" "$ANDROID_HOME/cmdline-tools"
            unzip -q "$archive" -d "$unpack"
            mv "$unpack/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.31.6'
      - name: Assemble Android
        run: scripts/build-android.sh all
      - name: Strict debug and release lint
        working-directory: android
        run: ./gradlew --no-daemon --warning-mode all :app:lintDebug :app:lintRelease
      - name: Verify debug and release artifacts
        run: |
          scripts/verify-android.sh android/app/build/outputs/apk/debug/app-debug.apk
          scripts/verify-android.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Record exact qualification evidence
        run: python3 tools/project.py evidence --output build/evidence/android.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-android-evidence
          path: build/evidence
          if-no-files-found: error
