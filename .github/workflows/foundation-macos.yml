name: Foundation macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13.5'
      - name: Prepare pinned offline art tools
        run: python3 tools/bootstrap_art_tools.py --download-blender
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            external
            build/host-tools
          key: macos-host-tools-${{ hashFiles('dependencies.lock.json') }}
      - name: Install Ninja
        run: brew install ninja
      - name: Select compatible installed Xcode
        run: python3 tools/generators/select_xcode.py --minimum-major 26 --github-env "$GITHUB_ENV"
      - name: Install Xcode Metal toolchain component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Check prerequisites
        run: python3 tools/project.py doctor --platform macos
      - name: Bootstrap exact dependencies and host tools
        run: python3 tools/project.py bootstrap
      - name: Verify foundation
        run: python3 tools/project.py verify
      - name: Smoke SDL GPU
        env:
          FOUNDATION_SMOKE_REPORT: build/evidence/smoke-macos.log
        run: |
          mkdir -p build/evidence
          build/dev/human_resources_player --smoke-test
          cat build/evidence/smoke-macos.log
          python3 tools/generators/audit_smoke_report.py \
            --report build/evidence/smoke-macos.log --expected-backend metal
      - name: Build and audit release package
        run: python3 tools/project.py package --platform macos
      - name: Record exact qualification evidence
        run: >-
          python3 tools/project.py evidence
          --smoke-log build/evidence/smoke-macos.log
          --output build/evidence/macos.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-macos-evidence
          path: build/evidence
          if-no-files-found: error
